name: ED Pocket offline anatomy build
on:
  pull_request:
    paths:
      - 'ed-pocket-v1.7/**'
      - '.github/workflows/ed-pocket-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ed-pocket"
          base64 -d ed-pocket-v1.7/source-archive.zip.b64 > "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/ed-pocket"
          test -f "$RUNNER_TEMP/ed-pocket/build_release.py"
      - name: Download and verify licensed original illustrations
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ed-pocket"
          python3 build_release.py
          unzip -t ../ED_Pocket_v1.7_Offline_Atlas_complete.zip | tail -1
          test "$(find anatomy -type f | wc -l)" -eq 6
      - name: Upload complete offline package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ed-pocket-v1.7-verified-offline
          path: ${{ runner.temp }}/ED_Pocket_v1.7_Offline_Atlas_complete.zip
          if-no-files-found: error
          retention-days: 30

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="01  |  Controlled head delivery"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64e0cb"/></marker><marker id="warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#ff909a"/></marker></defs><rect width="800" height="450" rx="22" fill="#101e30"/><text x="30" y="43" fill="#e8f1fa" font-family="Arial,sans-serif" font-size="24" font-weight="bold">01  |  Controlled head delivery</text><rect x="30" y="75" width="390" height="305" rx="16" fill="#192d42" stroke="#64e0cb" stroke-width="2"/><rect x="450" y="75" width="320" height="305" rx="16" fill="#192d42" stroke="#f3c37b" stroke-width="2"/><path d="M120 135 Q80 220 145 330 M335 135 Q380 220 315 330" fill="none" stroke="#b6c6d7" stroke-width="34" stroke-linecap="round"/><ellipse cx="225" cy="250" rx="85" ry="87" fill="#e9b69c" stroke="#f6dacb" stroke-width="5"/><path d="M184 213 Q225 180 270 214" fill="none" stroke="#936b62" stroke-width="5"/><line x1="225" y1="332" x2="225" y2="360" stroke="#64e0cb" stroke-width="5" stroke-linecap="round" marker-end="url(#arr)"/><text x="225" y="114" font-family="Arial,sans-serif" font-size="18" fill="#e8f1fa" font-weight="normal" text-anchor="middle">Crowning / controlled head</text><text x="472" y="125" font-family="Arial,sans-serif" font-size="20" fill="#64e0cb" font-weight="bold" text-anchor="start">Support, do not restrain</text><text x="472" y="170" font-family="Arial,sans-serif" font-size="18" fill="#e8f1fa" font-weight="normal" text-anchor="start">• Allow controlled extension</text><text x="472" y="208" font-family="Arial,sans-serif" font-size="18" fill="#e8f1fa" font-weight="normal" text-anchor="start">• Check for nuchal cord</text><text x="472" y="246" font-family="Arial,sans-serif" font-size="18" fill="#e8f1fa" font-weight="normal" text-anchor="start">• Allow restitution</text><text x="472" y="284" font-family="Arial,sans-serif" font-size="18" fill="#e8f1fa" font-weight="normal" text-anchor="start">• Gentle axial assistance only</text><text x="472" y="335" font-family="Arial,sans-serif" font-size="17" fill="#ff909a" font-weight="bold" text-anchor="start">STOP: no forceful traction</text><text x="30" y="430" fill="#9eb2c7" font-family="Arial,sans-serif" font-size="13">ED Pocket • conceptual training diagram • not to scale</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="04  |  NRP first decision points"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64e0cb"/></marker><marker id="warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#ff909a"/></marker></defs><rect width="800" height="450" rx="22" fill="#101e30"/><text x="30" y="43" fill="#e8f1fa" font-family="Arial,sans-serif" font-size="24" font-weight="bold">04  |  NRP first decision points</text><rect x="250" y="69" width="300" height="56" rx="16" fill="#192d42" stroke="#64e0cb" stroke-width="2"/><text x="400" y="104" font-family="Arial,sans-serif" font-size="20" fill="#e8f1fa" font-weight="normal" text-anchor="middle">BIRTH: rapid assessment</text><line x1="400" y1="125" x2="400" y2="153" stroke="#64e0cb" stroke-width="5" stroke-linecap="round" marker-end="url(#arr)"/><rect x="150" y="154" width="500" height="67" rx="16" fill="#192d42" stroke="#f3c37b" stroke-width="2"/><text x="400" y="180" font-family="Arial,sans-serif" font-size="21" fill="#f3c37b" font-weight="bold" text-anchor="middle">Apnea / gasping OR HR &lt;100?</text><text x="400" y="205" font-family="Arial,sans-serif" font-size="17" fill="#e8f1fa" font-weight="normal" text-anchor="middle">Warm • position • stimulate; assess HR</text><line x1="400" y1="221" x2="400" y2="248" stroke="#64e0cb" stroke-width="5" stroke-linecap="round" marker-end="url(#arr)"/><rect x="210" y="248" width="380" height="63" rx="16" fill="#192d42" stroke="#64e0cb" stroke-width="2"/><text x="400" y="276" font-family="Arial,sans-serif" font-size="23" fill="#64e0cb" font-weight="bold" text-anchor="middle">PPV 30–60/min</text><text x="400" y="297" font-family="Arial,sans-serif" font-size="16" fill="#e8f1fa" font-weight="normal" text-anchor="middle">Reassess after 30 s EFFECTIVE ventilation</text><line x1="400" y1="311" x2="400" y2="338" stroke="#64e0cb" stroke-width="5" stroke-linecap="round" marker-end="url(#arr)"/><rect x="35" y="341" width="235" height="57" rx="16" fill="#192d42" stroke="#64e0cb" stroke-width="2"/><rect x="285" y="341" width="230" height="57" rx="16" fill="#192d42" stroke="#f3c37b" stroke-width="2"/><rect x="530" y="341" width="235" height="57" rx="16" fill="#192d42" stroke="#ff909a" stroke-width="2"/><text x="152" y="364" font-family="Arial,sans-serif" font-size="19" fill="#64e0cb" font-weight="bold" text-anchor="middle">HR ≥100</text><text x="152" y="386" font-family="Arial,sans-serif" font-size="15" fill="#e8f1fa" font-weight="normal" text-anchor="middle">Support / observe</text><text x="400" y="364" font-family="Arial,sans-serif" font-size="19" fill="#f3c37b" font-weight="bold" text-anchor="middle">HR 60–99</text><text x="400" y="386" font-family="Arial,sans-serif" font-size="15" fill="#e8f1fa" font-weight="normal" text-anchor="middle">Continue / correct PPV</text><text x="647" y="364" font-family="Arial,sans-serif" font-size="19" fill="#ff909a" font-weight="bold" text-anchor="middle">HR &lt;60</text><text x="647" y="386" font-family="Arial,sans-serif" font-size="15" fill="#e8f1fa" font-weight="normal" text-anchor="middle">Airway + 3:1 CPR</text><text x="30" y="430" fill="#9eb2c7" font-family="Arial,sans-serif" font-size="13">ED Pocket • conceptual training diagram • not to scale</text></svg>
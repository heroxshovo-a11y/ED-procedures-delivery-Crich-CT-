<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="ADULT CICO  |  Emergency front-of-neck airway"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#65dfc7"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#f2c36e"/></marker></defs><rect width="960" height="540" rx="20" fill="#0e1a2a"/><text x="36" y="48" fill="#edf6ff" font-size="27" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">ADULT CICO  |  Emergency front-of-neck airway</text><path d="M36 65 H924" stroke="#2b465e" stroke-width="2"/><rect x="35" y="100" width="890" height="95" rx="15" fill="#17283b" stroke="#ff858f" stroke-width="2"/><text x="480" y="139" fill="#ff858f" font-size="25" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Cannot intubate AND cannot oxygenate?</text><text x="480" y="169" fill="#edf6ff" font-size="20" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Declare CICO; call for help; proceed to trained eFONA</text><rect x="35" y="257" width="283" height="145" rx="15" fill="#17283b" stroke="#65dfc7" stroke-width="2"/><text x="176" y="311" fill="#65dfc7" font-size="24" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">IDENTIFY</text><text x="176" y="360" fill="#edf6ff" font-size="17" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Anterior neck / midline</text><path d="M320 330 L336 330" stroke="#65dfc7" stroke-width="4" marker-end="url(#a)"/><rect x="338" y="257" width="283" height="145" rx="15" fill="#17283b" stroke="#f2c36e" stroke-width="2"/><text x="479" y="311" fill="#f2c36e" font-size="24" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">ACCESS</text><text x="479" y="360" fill="#edf6ff" font-size="17" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Membrane by trained technique</text><path d="M623 330 L639 330" stroke="#65dfc7" stroke-width="4" marker-end="url(#a)"/><rect x="641" y="257" width="283" height="145" rx="15" fill="#17283b" stroke="#65dfc7" stroke-width="2"/><text x="782" y="311" fill="#65dfc7" font-size="24" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">VENTILATE</text><text x="782" y="360" fill="#edf6ff" font-size="17" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Tube placement + waveform CO₂</text><text x="36" y="516" fill="#b5c8d8" font-size="14" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">ED POCKET  •  SCHEMATIC / NOT TO SCALE  •  VERIFY LOCAL PROTOCOL</text></svg>
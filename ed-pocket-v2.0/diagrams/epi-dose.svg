<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="NEWBORN  |  Epinephrine safety check"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#65dfc7"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#f2c36e"/></marker></defs><rect width="960" height="540" rx="20" fill="#0e1a2a"/><text x="36" y="48" fill="#edf6ff" font-size="27" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">NEWBORN  |  Epinephrine safety check</text><path d="M36 65 H924" stroke="#2b465e" stroke-width="2"/><rect x="35" y="90" width="890" height="93" rx="15" fill="#17283b" stroke="#ff858f" stroke-width="2"/><text x="480" y="123" fill="#ff858f" font-size="26" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">CONFIRM: epinephrine 0.1 mg/mL (100 mcg/mL)</text><text x="480" y="155" fill="#edf6ff" font-size="18" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Read vial / syringe concentration aloud; independent second check</text><rect x="35" y="211" width="425" height="218" rx="15" fill="#17283b" stroke="#65dfc7" stroke-width="2"/><text x="247" y="259" fill="#65dfc7" font-size="23" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">IV / UVC / IO</text><text x="247" y="315" fill="#edf6ff" font-size="27" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0.01–0.03 mg/kg</text><text x="247" y="363" fill="#65dfc7" font-size="25" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">= 0.1–0.3 mL/kg</text><text x="247" y="402" fill="#b5c8d8" font-size="17" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Flush per resuscitation protocol</text><rect x="495" y="211" width="430" height="218" rx="15" fill="#17283b" stroke="#f2c36e" stroke-width="2"/><text x="710" y="259" fill="#f2c36e" font-size="23" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">ETT (bridge only)</text><text x="710" y="315" fill="#edf6ff" font-size="27" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0.05–0.1 mg/kg</text><text x="710" y="363" fill="#f2c36e" font-size="25" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">= 0.5–1 mL/kg</text><text x="710" y="402" fill="#b5c8d8" font-size="17" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Vascular route preferred</text><text x="36" y="516" fill="#b5c8d8" font-size="14" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">ED POCKET  •  SCHEMATIC / NOT TO SCALE  •  VERIFY LOCAL PROTOCOL</text></svg>
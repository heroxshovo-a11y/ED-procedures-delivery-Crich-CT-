<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="NEWBORN  |  Fix ventilation first"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#65dfc7"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#f2c36e"/></marker></defs><rect width="960" height="540" rx="20" fill="#0e1a2a"/><text x="36" y="48" fill="#edf6ff" font-size="27" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">NEWBORN  |  Fix ventilation first</text><path d="M36 65 H924" stroke="#2b465e" stroke-width="2"/><rect x="35" y="95" width="890" height="70" rx="15" fill="#17283b" stroke="#ff858f" stroke-width="2"/><text x="480" y="126" fill="#ff858f" font-size="25" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">HR not rising with PPV?</text><text x="480" y="151" fill="#edf6ff" font-size="18" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Look for chest movement; correct ineffective ventilation</text><rect x="35" y="205" width="283" height="112" rx="15" fill="#17283b" stroke="#65dfc7" stroke-width="2"/><text x="52" y="247" fill="#65dfc7" font-size="21" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">1  MASK</text><text x="52" y="286" fill="#edf6ff" font-size="17" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Seal / two-person hold</text><rect x="338" y="205" width="283" height="112" rx="15" fill="#17283b" stroke="#65dfc7" stroke-width="2"/><text x="355" y="247" fill="#65dfc7" font-size="21" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">2  POSITION</text><text x="355" y="286" fill="#edf6ff" font-size="17" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Neutral / slight extension</text><rect x="641" y="205" width="283" height="112" rx="15" fill="#17283b" stroke="#65dfc7" stroke-width="2"/><text x="658" y="247" fill="#65dfc7" font-size="21" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">3  AIRWAY</text><text x="658" y="286" fill="#edf6ff" font-size="17" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Clear only if obstructed</text><rect x="35" y="340" width="283" height="112" rx="15" fill="#17283b" stroke="#f2c36e" stroke-width="2"/><text x="52" y="382" fill="#f2c36e" font-size="21" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">4  PRESSURE</text><text x="52" y="421" fill="#edf6ff" font-size="17" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Titrate to chest rise</text><rect x="338" y="340" width="283" height="112" rx="15" fill="#17283b" stroke="#f2c36e" stroke-width="2"/><text x="355" y="382" fill="#f2c36e" font-size="21" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">5  ALTERNATIVE</text><text x="355" y="421" fill="#edf6ff" font-size="17" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">SGA or ETT if ineffective</text><text x="36" y="516" fill="#b5c8d8" font-size="14" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">ED POCKET  •  SCHEMATIC / NOT TO SCALE  •  VERIFY LOCAL PROTOCOL</text></svg>
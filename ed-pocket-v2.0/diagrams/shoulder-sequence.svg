<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="SHOULDER DYSTOCIA  |  Escalate without delay"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#65dfc7"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#f2c36e"/></marker></defs><rect width="960" height="540" rx="20" fill="#0e1a2a"/><text x="36" y="48" fill="#edf6ff" font-size="27" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">SHOULDER DYSTOCIA  |  Escalate without delay</text><path d="M36 65 H924" stroke="#2b465e" stroke-width="2"/><rect x="35" y="95" width="890" height="76" rx="15" fill="#17283b" stroke="#ff858f" stroke-width="2"/><text x="480" y="127" fill="#ff858f" font-size="23" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">HEAD DELIVERED • SHOULDERS STUCK</text><text x="480" y="154" fill="#edf6ff" font-size="18" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Declare dystocia • call for help • start clock</text><rect x="35" y="221" width="283" height="146" rx="15" fill="#17283b" stroke="#65dfc7" stroke-width="2"/><text x="176" y="269" fill="#65dfc7" font-size="21" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1  McROBERTS</text><text x="176" y="315" fill="#edf6ff" font-size="18" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Hyperflex maternal hips</text><rect x="338" y="221" width="283" height="146" rx="15" fill="#17283b" stroke="#65dfc7" stroke-width="2"/><text x="479" y="269" fill="#65dfc7" font-size="21" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">2  SUPRAPUBIC</text><text x="479" y="315" fill="#edf6ff" font-size="18" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Adduct / rotate shoulder</text><rect x="641" y="221" width="283" height="146" rx="15" fill="#17283b" stroke="#f2c36e" stroke-width="2"/><text x="782" y="269" fill="#f2c36e" font-size="21" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">3  INTERNAL</text><text x="782" y="315" fill="#edf6ff" font-size="18" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Posterior arm or rotation</text><text x="480" y="429" fill="#ff858f" font-size="21" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">NO fundal pressure • NO forceful head traction</text><text x="36" y="516" fill="#b5c8d8" font-size="14" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">ED POCKET  •  SCHEMATIC / NOT TO SCALE  •  VERIFY LOCAL PROTOCOL</text></svg>
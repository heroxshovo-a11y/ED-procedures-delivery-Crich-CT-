<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="NEWBORN  |  Coordinated chest compressions"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#65dfc7"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#f2c36e"/></marker></defs><rect width="960" height="540" rx="20" fill="#0e1a2a"/><text x="36" y="48" fill="#edf6ff" font-size="27" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">NEWBORN  |  Coordinated chest compressions</text><path d="M36 65 H924" stroke="#2b465e" stroke-width="2"/><rect x="35" y="90" width="435" height="365" rx="15" fill="#17283b" stroke="#65dfc7" stroke-width="2"/><rect x="490" y="90" width="435" height="365" rx="15" fill="#17283b" stroke="#f2c36e" stroke-width="2"/><circle cx="253" cy="253" r="102" stroke="#80baf6" stroke-width="3" fill="#17283b"/><path d="M252 170 L252 335" stroke="#edf6ff" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M203 245 H302" stroke="#edf6ff" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="252" cy="286" r="25" stroke="#ff858f" stroke-width="3" fill="none"/><text x="253" y="124" fill="#65dfc7" font-size="22" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">HAND POSITION</text><text x="253" y="410" fill="#edf6ff" font-size="18" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Two thumbs • lower 1/3 sternum</text><text x="707" y="133" fill="#f2c36e" font-size="66" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">3 : 1</text><text x="707" y="187" fill="#edf6ff" font-size="21" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Compression : ventilation</text><text x="707" y="257" fill="#65dfc7" font-size="22" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">90 compressions / min</text><text x="707" y="304" fill="#65dfc7" font-size="22" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">30 breaths / min</text><text x="707" y="364" fill="#edf6ff" font-size="21" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Reassess HR after 60 s</text><text x="707" y="405" fill="#b5c8d8" font-size="17" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">coordinated CPR + ventilation</text><text x="36" y="516" fill="#b5c8d8" font-size="14" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">ED POCKET  •  SCHEMATIC / NOT TO SCALE  •  VERIFY LOCAL PROTOCOL</text></svg>
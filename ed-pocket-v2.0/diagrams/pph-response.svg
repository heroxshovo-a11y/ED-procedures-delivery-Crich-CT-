<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="POSTPARTUM HEMORRHAGE  |  Parallel response"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#65dfc7"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#f2c36e"/></marker></defs><rect width="960" height="540" rx="20" fill="#0e1a2a"/><text x="36" y="48" fill="#edf6ff" font-size="27" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">POSTPARTUM HEMORRHAGE  |  Parallel response</text><path d="M36 65 H924" stroke="#2b465e" stroke-width="2"/><rect x="35" y="94" width="890" height="80" rx="15" fill="#17283b" stroke="#ff858f" stroke-width="2"/><text x="480" y="126" fill="#ff858f" font-size="26" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Recognize bleeding / shock</text><text x="480" y="157" fill="#edf6ff" font-size="18" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Call for help • quantify loss • blood / MTP as needed</text><path d="M480 175 L480 215" stroke="#65dfc7" stroke-width="4" marker-end="url(#a)"/><rect x="35" y="220" width="283" height="125" rx="15" fill="#17283b" stroke="#65dfc7" stroke-width="2"/><text x="176" y="263" fill="#65dfc7" font-size="19" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">MASSAGE + OXYTOCIC</text><text x="176" y="308" fill="#edf6ff" font-size="16" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Tone / uterotonics</text><rect x="338" y="220" width="283" height="125" rx="15" fill="#17283b" stroke="#65dfc7" stroke-width="2"/><text x="479" y="263" fill="#65dfc7" font-size="19" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">TXA EARLY</text><text x="479" y="308" fill="#edf6ff" font-size="16" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Within 3 h of birth</text><rect x="641" y="220" width="283" height="125" rx="15" fill="#17283b" stroke="#65dfc7" stroke-width="2"/><text x="782" y="263" fill="#65dfc7" font-size="19" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">EXAM + ESCALATE</text><text x="782" y="308" fill="#edf6ff" font-size="16" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Trauma / tissue / clotting</text><rect x="100" y="374" width="760" height="80" rx="15" fill="#17283b" stroke="#f2c36e" stroke-width="2"/><text x="480" y="408" fill="#f2c36e" font-size="23" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Ongoing severe hemorrhage?</text><text x="480" y="438" fill="#edf6ff" font-size="17" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Compression / tamponade where trained / definitive surgery or transfer</text><text x="36" y="516" fill="#b5c8d8" font-size="14" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">ED POCKET  •  SCHEMATIC / NOT TO SCALE  •  VERIFY LOCAL PROTOCOL</text></svg>